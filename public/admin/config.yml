backend:
  name: git-gateway
  branch: main

local_backend: true
publish_mode: editorial_workflow

media_folder: "public/uploads/images"
public_folder: "/uploads/images"

collections:
  - name: "walks"
    label: "Walks"
    folder: "src/content/walks"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text", hint: "Short listing summary." }
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Walk Date", name: "walkDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Actual date of the walk — used to match photos. Defaults to Publish Date if not set." }
      - { label: "Distance (miles)", name: "distance", widget: "number", value_type: "float", min: 0.1, step: 0.1 }
      - { label: "Difficulty", name: "difficulty", widget: "select", options: ["Easy", "Moderate", "Hard"] }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Region", name: "region", widget: "string" }
      - { label: "Dog-Friendly", name: "dogFriendly", widget: "boolean", default: true }
      - { label: "Parking Info", name: "parking", required: false, widget: "string" }

      # Everything below was in the content but not in this list. Decap writes
      # the file from these fields alone, so an unlisted field is dropped on
      # save: editing one walk here would have quietly stripped its ascent,
      # grid reference and every dog fact.
      - { label: "Ascent (m)", name: "ascentM", required: false, widget: "number", value_type: "int", min: 0, hint: "From the GPS track. Leave alone unless it is wrong." }
      - { label: "Distance actually walked (miles)", name: "routeDistance", required: false, widget: "number", value_type: "float", min: 0.1, step: 0.1, hint: "Only if it differs from the recorded distance, e.g. after retracing part of the route." }
      - { label: "Write-up status", name: "writeupStatus", required: false, widget: "select", options: ["draft", "reviewed"], hint: "Only reviewed walks get a public page. The rest show a coming soon notice." }
      - { label: "Featured", name: "featured", required: false, widget: "boolean", default: false }
      - { label: "Catalogue only", name: "catalogueOnly", required: false, widget: "boolean", default: false, hint: "In the list of routes, but with no page of its own." }
      - { label: "Companions", name: "companions", required: false, widget: "list", default: [], hint: "Who came along, Ember aside." }

      - { label: "Start grid reference", name: "startGridRef", required: false, widget: "string" }
      - { label: "Start postcode", name: "startPostcode", required: false, widget: "string" }
      - { label: "Refreshments", name: "refreshments", required: false, widget: "string" }
      - { label: "Toilets", name: "toilets", required: false, widget: "string" }

      - { label: "Stiles", name: "stiles", required: false, widget: "select", options: ["none", "few", "several", "many"] }
      - { label: "Open Access land", name: "accessLand", required: false, widget: "boolean", hint: "Dogs on a lead of 2m or less from 1 March to 31 July." }
      - { label: "Livestock", name: "livestock", required: false, widget: "select", options: ["none", "likely", "certain"] }
      - { label: "Water on route", name: "water", required: false, widget: "select", options: ["none", "some", "plenty"] }
      - { label: "Roads", name: "roads", required: false, widget: "select", options: ["none", "short", "significant"] }
      - { label: "Underfoot", name: "terrain", required: false, widget: "select", options: ["easy", "rough", "scrambly"] }
      - { label: "Off lead", name: "offLead", required: false, widget: "select", options: ["no", "partly", "mostly"] }
      - label: "Other dog notes"
        name: "dogNotes"
        required: false
        widget: "list"
        default: []
        summary: "{{fields.label}}"
        fields:
          - { label: "What to know", name: "label", widget: "string" }
          - { label: "More detail", name: "detail", required: false, widget: "string" }
          - { label: "Tone", name: "tone", widget: "select", options: ["good", "note", "warn"], default: "note" }
          - { label: "Icon", name: "icon", required: false, widget: "select", options: ["stiles", "water", "livestock", "access", "offlead", "roads", "terrain", "note"], default: "note" }
      - { label: "GPX Download URL", name: "gpxDownload", required: false, widget: "string" }
      - { label: "Strava Record URL", name: "stravaRecord", required: false, widget: "string" }
      - { label: "Strava Flyby URL", name: "stravaFlyby", required: false, widget: "string" }
      - { label: "OS Maps Link", name: "osMapsLink", required: false, widget: "string" }
      - { label: "Map Latitude", name: "routeMapLat", widget: "number", value_type: "float" }
      - { label: "Map Longitude", name: "routeMapLng", widget: "number", value_type: "float" }
      - { label: "Map Zoom", name: "routeMapZoom", widget: "number", value_type: "int", min: 5, max: 18, default: 12 }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Full Content", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Related Walk Slugs", name: "relatedWalks", widget: "list", default: [] }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Full Content", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", required: false, widget: "text" }
      - { label: "Location", name: "location", required: false, widget: "string" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }

  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: false
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO Description", name: "seoDescription", widget: "text" }
      # About page fields. Optional, so the other pages are unaffected, but they
      # must be listed or a save from the CMS drops them.
      - { label: "Opening photo", name: "heroImage", widget: "image", required: false }
      - { label: "Opening photo alt text", name: "heroAlt", widget: "string", required: false }
      - { label: "Opening story", name: "intro", widget: "text", required: false }
      - label: "People"
        name: "people"
        widget: "list"
        required: false
        fields:
          - { label: "Name", name: "heading", widget: "string" }
          - { label: "Role", name: "role", widget: "string", required: false }
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Photo alt text", name: "alt", widget: "string" }
          - { label: "Introduction", name: "body", widget: "text" }
      - { label: "What every walk includes", name: "includes", widget: "list", required: false, field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Note after the list", name: "includesNote", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Global Settings"
        name: "global"
        file: "src/content/settings/site.json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Base URL", name: "baseUrl", widget: "string" }
          - label: "Social"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - label: "Homepage Images"
            name: "homepage"
            widget: "object"
            fields:
              - { label: "Masthead Image", name: "mastheadImage", widget: "image" }
              - { label: "Masthead Alt Text", name: "mastheadAlt", widget: "string", required: false }
              - { label: "Masthead Caption", name: "mastheadCaption", widget: "string", required: false }
              - label: "Gallery Images"
                name: "galleryImages"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
